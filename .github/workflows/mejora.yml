name: Mejora semanal
on:
  schedule:
    - cron: "17 18 * * 0"   # domingos ~19:17 hora España
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: jarvis
  cancel-in-progress: false
jobs:
  mejora:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Analizar y mejorar
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python mejora.py
      - name: Guardar estrategia
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis@users.noreply.github.com"
          git add estrategia.json historial.json stats.json 2>/dev/null
          git commit -m "Jarvis: estrategia semanal" && (git pull --rebase && git push) || echo "sin cambios"
