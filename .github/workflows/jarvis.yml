name: Jarvis
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: jarvis
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: Jarvis crea y sube el Short
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python jarvis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: short, path: out.mp4, retention-days: 7, if-no-files-found: ignore }
      - name: Guardar memoria de temas
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis@users.noreply.github.com"
          for f in stats.json respondidos.json clips_usados.json historial.json comentarios.json; do [ -f "$f" ] || echo "[]" > "$f"; done
          git add -A tiktok_token.enc 2>/dev/null; git add temas.json stats.json respondidos.json clips_usados.json historial.json comentarios.json && git commit -m "Jarvis: nuevo tema" && (git pull --rebase && git push) || echo "sin cambios"
