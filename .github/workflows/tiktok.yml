name: Conectar TikTok
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de tiktok.html (o escribe: prueba-subida)"
        required: true
permissions:
  contents: write
concurrency:
  group: jarvis
  cancel-in-progress: false
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Prueba de subida
        if: inputs.code == 'prueba-subida'
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tiktok_prueba.py
      - name: Cambiar código por token
        if: inputs.code != 'prueba-subida'
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python tiktok_auth.py "$CODE"
      - name: Guardar
        if: always()
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis@users.noreply.github.com"
          [ -f tiktok_token.enc ] && git add tiktok_token.enc; git commit -m "Jarvis: token TikTok" || exit 0; git pull --rebase --autostash -X theirs && git push
