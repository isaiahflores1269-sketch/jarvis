name: Conectar TikTok
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de tiktok.html"
        required: true
permissions:
  contents: write
concurrency:
  group: jarvis
  cancel-in-progress: false
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Cambiar código por token
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python tiktok_auth.py "$CODE"
      - name: Guardar
        run: |
          git config user.name "jarvis-bot"; git config user.email "jarvis@users.noreply.github.com"
          git add tiktok_token.enc && git commit -m "Jarvis: TikTok conectado" && (git pull --rebase && git push)
